[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klay-songformer"
description = "SongFormer section detection, vendored for sys.path loading"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.hatch.version]
path = "src/klay_songformer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/klay_songformer"]

[tool.hatch.build.targets.wheel.force-include]
"../../src/SongFormer" = "klay_songformer/_vendor/SongFormer"
"../../src/third_party/musicfm" = "klay_songformer/_vendor/third_party/musicfm"
