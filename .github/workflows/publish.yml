name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AR_URL: https://us-python.pkg.dev/klay-app-463011/klay-python
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5

      - name: Build wheel
        working-directory: packages/klay-songformer
        run: uv build --wheel --out-dir dist

      - name: Read package metadata
        id: pkg
        working-directory: packages/klay-songformer
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          if [ "$(printf '%s\n' "$whl" | wc -l)" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist" >&2
            exit 1
          fi
          base=$(basename "$whl")
          wheel=${base%%-*}
          rest=${base#*-}
          version=${rest%%-*}
          if [ -z "$wheel" ] || [ -z "$version" ]; then
            echo "::error::could not parse name and version from $base" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "dist=$(echo "$wheel" | tr '_' '-' | tr '[:upper:]' '[:lower:]')"
            echo "wheel=$wheel"
          } >> "$GITHUB_OUTPUT"
          echo "${wheel} ${version}"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_AR_PUBLISH }}
          token_format: access_token

      - name: Download the published wheel if this version already exists
        id: precheck
        working-directory: packages/klay-songformer
        env:
          AR_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          DIST: ${{ steps.pkg.outputs.dist }}
          WHEEL: ${{ steps.pkg.outputs.wheel }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          href=$(curl -sf -u "oauth2accesstoken:${AR_TOKEN}" "${AR_URL}/simple/${DIST}/" \
            | grep -o "https://[^\"#]*/${WHEEL}-${VERSION}-[^\"#]*\.whl" | head -1 || true)
          if [ -z "$href" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          curl -sf -u "oauth2accesstoken:${AR_TOKEN}" -L -o published.whl "$href"

      - name: Fail if the published wheel does not match this build
        if: steps.precheck.outputs.published == 'true'
        working-directory: packages/klay-songformer
        env:
          DIST: ${{ steps.pkg.outputs.dist }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import zipfile

          def sources(path):
              with zipfile.ZipFile(path) as archive:
                  return {
                      name: archive.read(name)
                      for name in archive.namelist()
                      if name.endswith(".py")
                  }

          dist = os.environ["DIST"]
          version = os.environ["VERSION"]
          built = sources(glob.glob("dist/*.whl")[0])
          published = sources("published.whl")

          added = sorted(built.keys() - published.keys())
          removed = sorted(published.keys() - built.keys())
          changed = sorted(n for n in built.keys() & published.keys() if built[n] != published[n])

          if not (added or removed or changed):
              print(f"{dist} {version} already in Artifact Registry and identical — nothing to do")
              sys.exit(0)

          for name in added:
              print(f"::error::{name} is new in this build")
          for name in removed:
              print(f"::error::{name} is gone from this build")
          for name in changed:
              print(f"::error::{name} differs from the published {version}")
          print(
              f"::error::{dist} {version} is published with different sources. "
              "Artifact Registry versions are immutable — bump __version__ to ship this."
          )
          sys.exit(1)
          PY

      - name: Publish to Artifact Registry
        if: steps.precheck.outputs.published == 'false'
        working-directory: packages/klay-songformer
        env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          uv publish \
            --publish-url "${AR_URL}/" \
            --check-url "${AR_URL}/simple/" \
            dist/*
